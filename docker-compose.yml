# Запуск всего: docker compose up -d --build   ->   http://localhost:8080  (Swagger: /api/docs)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    image: prod-backend:${IMAGE_TAG:-latest}
    environment:
      # production: приложение не стартует с публичными секретами по умолчанию (см. backend/app/config.py)
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:-app}@db:5432/app
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-dev-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      SEED_DEMO: ${SEED_DEMO:-true}  # демо-данные для проверки жюри; на реальных данных - false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: prod-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
