# Запуск MoverMate на виртуальной машине:
#   cd deploy && cp .env.example .env   # впишите SITE_ADDRESS (имя сервера) для HTTPS
#   docker compose up -d --build
# Образ берётся готовый (APP_IMAGE, из реестра CI) или собирается из исходников.
services:
  app:
    image: ${APP_IMAGE:-movermate:latest}
    build:
      context: ..
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/app.db
      # демо-проект «Переезд на Лесную» для проверки жюри; на реальных данных поставьте false
      SEED_DEMO: "${SEED_DEMO:-true}"
      # пароль демо-аккаунта (логин demo); POST /api/auth/demo (для preflight.sh) входит и без него
      DEMO_PASSWORD: "${DEMO_PASSWORD:-demo-pereezd}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_REQUESTS_PER_HOUR: "${AI_REQUESTS_PER_HOUR:-10}"
      AI_GLOBAL_REQUESTS_PER_DAY: "${AI_GLOBAL_REQUESTS_PER_DAY:-50}"
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-45}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      MAPTILER_API_KEY: "${MAPTILER_API_KEY:-}"
      SAGE_LOGS_URL: "${SAGE_LOGS_URL:-}"
      SAGE_API_KEY: "${SAGE_API_KEY:-}"
    volumes:
      - movermate-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # здесь хранятся сертификаты: том нельзя терять, иначе лимиты Let's Encrypt
      - caddy-config:/config

volumes:
  movermate-data:
  caddy-data:
  caddy-config:
