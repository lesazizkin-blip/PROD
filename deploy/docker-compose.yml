# Запуск MoverMate на виртуальной машине: docker compose -f deploy/docker-compose.yml up -d --build
# Порт на ВМ: APP_PORT (по умолчанию 80). Образ берётся готовый (APP_IMAGE, из реестра CI) или собирается из исходников.
services:
  app:
    image: ${APP_IMAGE:-movermate:latest}
    build:
      context: ..
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/app.db
      # демо-проект «Переезд на Лесную» для проверки жюри; на реальных данных поставьте false
      SEED_DEMO: "${SEED_DEMO:-true}"
    volumes:
      - movermate-data:/data

volumes:
  movermate-data:
