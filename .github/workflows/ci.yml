name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Токену репозитория хватает чтения: ничего в репозиторий CI не пишет
permissions:
  contents: read

# Новый пуш отменяет предыдущий запуск той же ветки; на main запуски идут по очереди
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Стиль кода проверяется отдельно: красный линтер виден, но остальное не блокирует.
  # Починить: make fmt
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt -c backend/constraints.txt
      - name: Backend (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend (oxlint + tsc)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc -b

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Тесты на SQLite + покрытие
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Те же тесты на PostgreSQL (включая гонку параллельных переходов)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
        run: pytest -rs
      - name: Отчёт о покрытии в summary
        if: always()
        run: |
          echo '### Покрытие тестами (backend)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
      - name: Миграции на PostgreSQL (применяются и откатываются)
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Продовый образ (тот же Dockerfile, что на ВМ): собрать, запустить, прогнать сценарий ТЗ.
  # Деплоя из GitHub нет: стенд обновляется вручную (docs/DEPLOY_VM.md).
  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t movermate:ci .
      - run: docker run -d --name app -p 8000:8000 -e SEED_DEMO=true movermate:ci
      - name: Предполётная проверка
        run: |
          for i in $(seq 1 40); do curl -fs localhost:8000/api/health && break || sleep 2; done
          scripts/preflight.sh http://localhost:8000
      - name: Логи при падении
        if: failure()
        run: docker logs app
