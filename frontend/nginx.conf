server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker-DNS: адрес backend перерезолвится сам, если контейнер пересоздан с новым IP (иначе 502 до рестарта nginx)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # add_header внутри location отменяет заголовки уровня server, поэтому nosniff повторён в каждом блоке

  # API проксируется на бэкенд: у фронтенда и API один origin, CORS не нужен
  location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
  }

  # Файлы с хешем в имени можно кэшировать навсегда
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # index.html не кэшируем: после деплоя браузер сразу берёт новые хеши файлов
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  # SPA: любой неизвестный путь отдаёт index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }
}
