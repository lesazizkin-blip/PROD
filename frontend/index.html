      if (location.protocol === 'file:') {
        document.getElementById('root').innerHTML =
          '<div style="font-family:system-ui,sans-serif;max-width:520px;margin:15vh auto;padding:16px;line-height:1.5">' +

          'Запустите <code>scripts/run-site.sh</code> и откройте <b>http://localhost:8000</b>.</p></div>'
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
