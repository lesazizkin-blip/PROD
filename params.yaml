# Все настройки пайплайна здесь. Меняешь значение -> dvc repro -> новый эксперимент в MLflow.
data:
  raw_path: data/raw/dataset.csv
  target: salary
  test_size: 0.2
  val_size: 0.2
  seed: 42

features:
  numeric: [experience_years, skills_count, company_size, remote]
  categorical: [role, region, education]

model:
  # Квантили: нижняя граница, медиана, верхняя граница ("вилка").
  # Для обычной точечной регрессии оставь только [0.5].
  quantiles: [0.1, 0.5, 0.9]
  max_iter: 150
  learning_rate: 0.05
  max_depth: 4
  min_samples_leaf: 60

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: prod-hackathon
