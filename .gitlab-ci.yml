# GitLab CI MoverMate по шаблону организаторов (templates/l2sh-template), подробности - docs/OPERATIONS.md.
#
#   lint ──► test ──► build:image ──► setup:vm ──► deploy:vm ──► preflight:prod
#   (стиль)  (тесты,   (Kaniko →      (Spirit CLI   (ssh + docker   (сценарий ТЗ
#            покрытие)  Spirit Registry) на ВМ)       compose)        на живом сайте)
#
# На любой ветке идут lint и test; сборка образа - на master и в Merge Request; деплой - только из master.
# Секреты задаются в Spirit (Код → Репозитории → prod_1 → CI-переменные), не в этом файле:
#   SSH_PRIVATE_KEY (тип «Файл», приватный ключ ВМ целиком, «Защищённая»; \r и перевод строки CI поправит сам);
#   SPIRIT_DOCKER_SA_KEY уже заведена организаторами на уровне тенанта.

include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/spirit.yaml
      - /jobs/build.yaml
      - /jobs/rules.yaml

stages: [lint, test, build, deploy]

# Один пайплайн на изменение: в открытом Merge Request - пайплайн MR, без него - пайплайн ветки
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  PG_URL: "postgresql+psycopg://app:app@postgres:5432/app"
  # --- из шаблона организаторов ---
  # Адрес Docker Registry Spirit: без него Kaniko пушит в Docker Hub и получает 401.
  # В шаблоне l2sh-template указан registry.spirit.culab.ru, но с раннеров он не резолвится (no such host);
  # наша платформа на домене t-education.com, раннер сам берёт образы оттуда
  DOCKER_ARTIFACTORY_REGISTRY: registry.spirit.t-education.com
  # Образ: registry.spirit.t-education.com/hack-led-20/prod_1:<sha коммита>
  IMAGE_NAME: ${DOCKER_ARTIFACTORY_REGISTRY}/${CI_PROJECT_ROOT_NAMESPACE}/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}
  # Наша ВМ vm1 (Spirit VMaaS) и её пользователь; не секрет. Переменные репозитория в Spirit приоритетнее
  DEPLOY_VM: 178.72.185.97
  DEPLOY_SSH_USER: root
  # Где на ВМ лежит стек (Caddy + app, deploy/docker-compose.yml) и его deploy/.env с SITE_ADDRESS
  DEPLOY_DIR: /opt/movermate/deploy
  # Адрес сайта для проверки после деплоя
  APP_URL: https://hack-led-20-vm1-12902f.vmaas-spirit.t-education.com
  # Образ для джоб, которые ходят на ВМ: нужны только ssh и scp (Spirit CLI запускается на самой ВМ).
  # Тот же образ, что в общих заданиях организаторов (pipelines/pipelines, jobs/docker.yaml);
  # base-noble из шаблона l2sh-template в реестре t-education.com не найден
  DEPLOY_IMG: kroniak/ssh-client:3.19

.cache: &cache
  cache:
    key: "$CI_JOB_NAME"
    paths: [.cache/]

# ---------------------------------------------------------------- lint (деплой не блокирует)
lint-backend:
  stage: lint
  image: mirror.gcr.io/library/python:3.11-slim
  <<: *cache
  allow_failure: true
  script:
    - pip install -r backend/requirements-dev.txt -c backend/constraints.txt
    - cd backend
    - ruff check .
    - ruff format --check .

lint-frontend:
  stage: lint
  image: mirror.gcr.io/library/node:22-alpine
  <<: *cache
  allow_failure: true
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npx tsc -b

# ---------------------------------------------------------------- тесты (деплой ждёт их)
test-backend:
  stage: test
  image: mirror.gcr.io/library/python:3.11-slim
  <<: *cache
  services:
    - name: mirror.gcr.io/library/postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
  script:
    - pip install -r backend/requirements-dev.txt -c backend/constraints.txt
    - cd backend
    # 1) SQLite + покрытие; результаты видны в GitLab (вкладка «Tests» и процент покрытия пайплайна)
    - pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=report.xml
    # 2) те же тесты на PostgreSQL, включая параллельную выдачу номеров коробок
    - TEST_DATABASE_URL="$PG_URL" pytest -rs
    # 3) миграции применяются и откатываются
    - DATABASE_URL="$PG_URL" alembic upgrade head
    - DATABASE_URL="$PG_URL" alembic downgrade base
    - DATABASE_URL="$PG_URL" alembic upgrade head
  coverage: '/^TOTAL\s+.*\s+(\d+)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/htmlcov
    reports:
      junit: backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

test-frontend:
  stage: test
  image: mirror.gcr.io/library/node:22-alpine
  <<: *cache
  script:
    - cd frontend
    - npm ci
    - npm run test:ci
    - npm run build
  # процент строк из text-summary vitest; отчёты: тесты в MR (junit) и покрытие строк в диффе (cobertura)
  coverage: '/^Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - frontend/coverage/
    reports:
      junit: frontend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

# ---------------------------------------------------------------- сборка образа (шаблон .dp_build)
# Kaniko собирает корневой Dockerfile (сайт + сервер в одном образе) и публикует его в Spirit Registry.
build:image:
  stage: build
  extends:
    - .dp_build
    - .rules-merge-or-master-or-parent
  needs: [test-backend, test-frontend]

# ---------------------------------------------------------------- деплой на ВМ (только master)
.ssh_vm:
  image: $DEPLOY_IMG
  variables:
    SSH: "ssh -i /tmp/vm_key -o StrictHostKeyChecking=accept-new"
    SCP: "scp -i /tmp/vm_key -o StrictHostKeyChecking=accept-new"
    VM: "$DEPLOY_SSH_USER@$DEPLOY_VM"
    # версия Spirit CLI та же, что у раннеров (dp 14.1.3 tedu)
    DP_CLI_URL: "https://spirit.t-education.com/cli/tedu/14.1.3/linux/dp"
  before_script:
    - |
      if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "Нет SSH_PRIVATE_KEY: заведите её в Spirit (Код → Репозитории → prod_1 → CI-переменные), тип «Файл»"; exit 1
      fi
    - command -v ssh >/dev/null || (apk add --no-cache openssh-client 2>/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client))
    # ключ из веб-формы часто приходит с \r или без перевода строки в конце: ssh такой не читает
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then tr -d '\r' < "$SSH_PRIVATE_KEY" > /tmp/vm_key; else printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > /tmp/vm_key; fi
      [ -n "$(tail -c 1 /tmp/vm_key)" ] && echo >> /tmp/vm_key
      chmod 600 /tmp/vm_key
      ! command -v ssh-keygen >/dev/null || ssh-keygen -y -f /tmp/vm_key > /dev/null || { echo "SSH_PRIVATE_KEY не читается как ключ: вставьте файл vm1.pem целиком, от BEGIN до END"; exit 1; }

# Spirit CLI (dp) на ВМ нужен, чтобы войти в registry ключом сервис-аккаунта
setup:vm:
  stage: deploy
  extends:
    - .ssh_vm
    - .rules-master
  needs: [build:image]
  script:
    - |
      $SSH $VM "command -v dp >/dev/null || (
        curl -fL $DP_CLI_URL -o /tmp/dp &&
        chmod +x /tmp/dp && sudo mv /tmp/dp /usr/local/bin/dp )"

# Отличие от шаблона: на ВМ уже работает стек Caddy (HTTPS) + app. Обновляем compose-файл и Caddyfile,
# меняем образ app на собранный (APP_IMAGE) и перезапускаем только app. В deploy/.env на ВМ меняется только APP_IMAGE
# (чтобы ручной `docker compose up` не поднял старый образ без новых миграций);
# том с базой и том с сертификатами сохраняются. Перед перезапуском - копия базы в /root/backups
# (deploy/backup.sh, онлайн-копия SQLite с проверкой), cron делает такие копии раз в час. Caddyfile примонтирован файлом: после копирования контейнер видит
# старую версию, поэтому при изменении Caddy пересоздаётся (сертификаты в томе caddy-data сохраняются).
deploy:vm:
  stage: deploy
  extends:
    - .ssh_vm
    - .rules-master
  needs: [build:image, setup:vm]
  resource_group: production
  script:
    - $SSH $VM "mkdir -p $DEPLOY_DIR /root/backups"
    - $SCP deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh deploy/watchdog.sh $VM:$DEPLOY_DIR/
    - $SCP "$SPIRIT_DOCKER_SA_KEY" $VM:$DEPLOY_DIR/spirit-sa-key.json
    # копии базы каждый час (последние 48, с проверкой целостности) - deploy/backup.sh по cron
    - $SSH $VM "chmod +x $DEPLOY_DIR/backup.sh && echo '17 * * * * root $DEPLOY_DIR/backup.sh >> /var/log/movermate-backup.log 2>&1' | sudo tee /etc/cron.d/movermate-backup >/dev/null"
    # сторож раз в минуту: поднимает упавший стек, перезапускает зависший app (deploy/watchdog.sh)
    - $SSH $VM "chmod +x $DEPLOY_DIR/watchdog.sh && echo '* * * * * root $DEPLOY_DIR/watchdog.sh >> /var/log/movermate-watchdog.log 2>&1' | sudo tee /etc/cron.d/movermate-watchdog >/dev/null"
    # цены на переезд по городам раз в сутки в 04:30 (python -m app.price_update; без сети - остаются прежние)
    - $SSH $VM "echo '30 4 * * * root docker exec deploy-app-1 python -m app.price_update >> /var/log/movermate-prices.log 2>&1' | sudo tee /etc/cron.d/movermate-prices >/dev/null"
    - |
      $SSH $VM "set -e; cd $DEPLOY_DIR &&
        ($DEPLOY_DIR/backup.sh ci || true) &&
        sudo dp auth service-acc --key-file spirit-sa-key.json &&
        sudo dp auth configure-docker &&
        rm -f spirit-sa-key.json &&
        sudo APP_IMAGE=$IMAGE_NAME docker compose pull app &&
        sudo APP_IMAGE=$IMAGE_NAME docker compose up -d --no-build &&
        (grep -q '^APP_IMAGE=' .env && sed -i 's#^APP_IMAGE=.*#APP_IMAGE=$IMAGE_NAME#' .env || echo 'APP_IMAGE=$IMAGE_NAME' >> .env) &&
        (sudo docker compose exec -T caddy cat /etc/caddy/Caddyfile | cmp -s - Caddyfile ||
          sudo docker compose up -d --no-deps --force-recreate caddy) &&
        docker image prune -f >/dev/null"
  environment:
    name: production
    url: $APP_URL

# Полный сценарий ТЗ на живом сайте (тот же scripts/preflight.sh, что запускается вручную)
preflight:prod:
  stage: deploy
  extends: .rules-master
  image: mirror.gcr.io/library/python:3.12-slim
  needs: [deploy:vm]
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl >/dev/null
    - for i in $(seq 1 30); do curl -fsS "$APP_URL/api/health" && break || sleep 4; done
    - bash scripts/preflight.sh "$APP_URL"
