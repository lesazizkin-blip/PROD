# GitLab CI MoverMate: стиль кода, тесты с покрытием, сборка продового образа и проверка сценария ТЗ.
# Деплой на ВМ пока вручную (docs/DEPLOY_VM.md); автодеплой по шаблону организаторов - docs/GITLAB.md.

stages: [lint, test, build]

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  PG_URL: "postgresql+psycopg://app:app@postgres:5432/app"

.cache: &cache
  cache:
    key: "$CI_JOB_NAME"
    paths: [.cache/]

# ---------------------------------------------------------------- lint (деплой НЕ блокирует)
lint-backend:
  stage: lint
  image: python:3.11-slim
  <<: *cache
  allow_failure: true
  script:
    - pip install -r backend/requirements-dev.txt -c backend/constraints.txt
    - cd backend
    - ruff check .
    - ruff format --check .

lint-frontend:
  stage: lint
  image: node:22-alpine
  <<: *cache
  allow_failure: true
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npx tsc -b

# ---------------------------------------------------------------- тесты (docker-раннер)
test-backend:
  stage: test
  image: python:3.11-slim
  <<: *cache
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
  script:
    - pip install -r backend/requirements-dev.txt -c backend/constraints.txt
    - cd backend
    # 1) SQLite + покрытие; результаты видны в интерфейсе GitLab (вкладка «Tests» и процент покрытия в пайплайне)
    - pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=report.xml
    # 2) те же тесты на PostgreSQL, включая гонку параллельных переходов статуса
    - TEST_DATABASE_URL="$PG_URL" pytest -rs
    # 3) миграции применяются и откатываются
    - DATABASE_URL="$PG_URL" alembic upgrade head
    - DATABASE_URL="$PG_URL" alembic downgrade base
    - DATABASE_URL="$PG_URL" alembic upgrade head
  coverage: '/^TOTAL\s+.*\s+(\d+)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/htmlcov
    reports:
      junit: backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

test-frontend:
  stage: test
  image: node:22-alpine
  <<: *cache
  script:
    - cd frontend
    - npm ci
    - npm test
    - npm run build

# ---------------------------------------------------------------- продовый образ
# Тот же Dockerfile, что на ВМ: собрать, запустить, прогнать сценарий ТЗ (scripts/preflight.sh).
# Нужен раннер с Docker-in-Docker; если его нет, задание падает и остальное не блокирует.
image-smoke:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  allow_failure: true
  script:
    - apk add --no-cache bash curl python3
    - docker build -t movermate:ci .
    - docker run -d --name app -p 8000:8000 -e SEED_DEMO=true movermate:ci
    - for i in $(seq 1 40); do curl -fs http://docker:8000/api/health && break || sleep 2; done
    - scripts/preflight.sh http://docker:8000
  after_script:
    - docker logs app || true
